<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TicketWave · US Concerts & Events</title>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0c14;
      color: #ffffff;
      min-height: 100vh;
      padding: 1.5rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app-wrapper {
      max-width: 1400px;
      width: 100%;
    }

    /* ===== HEADER ===== */
    .main-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
      padding: 0.5rem 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #ff2d55, #ff6b35);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: white;
      box-shadow: 0 8px 20px rgba(255, 45, 85, 0.35);
    }

    .brand-text {
      font-weight: 800;
      font-size: 1.8rem;
      letter-spacing: -0.5px;
      color: #fff;
    }
    .brand-text span { color: #ff2d55; }

    .search-bar {
      display: flex;
      align-items: center;
      background: #151925;
      border: 1px solid #242a3a;
      border-radius: 50px;
      padding: 0.6rem 1.2rem;
      gap: 10px;
      min-width: 260px;
      transition: 0.2s;
    }
    .search-bar:focus-within {
      border-color: #ff2d55;
      box-shadow: 0 0 0 3px rgba(255,45,85,0.15);
    }
    .search-bar i { color: #6b7a99; }
    .search-bar input {
      background: none;
      border: none;
      outline: none;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      width: 100%;
    }
    .search-bar input::placeholder { color: #6b7a99; }

    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .header-actions .user-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff6b35, #ff2d55);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      border: 2px solid rgba(255,255,255,0.1);
    }

    /* ===== HERO ===== */
    .hero-banner {
      background: linear-gradient(135deg, #1a0b2e 0%, #2d1b4e 40%, #1e1338 100%);
      border-radius: 28px;
      padding: 2.5rem 2.8rem;
      margin-bottom: 2rem;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .hero-banner::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -10%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(255,45,85,0.2) 0%, transparent 70%);
      border-radius: 50%;
    }
    .hero-banner::after {
      content: '';
      position: absolute;
      bottom: -40%;
      left: -5%;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(255,107,53,0.15) 0%, transparent 70%);
      border-radius: 50%;
    }
    .hero-content { position: relative; z-index: 1; }
    .hero-content .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,45,85,0.15);
      border: 1px solid rgba(255,45,85,0.3);
      color: #ff6b8a;
      padding: 0.35rem 1.1rem;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    .hero-content h1 {
      font-size: 2.6rem;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1.15;
      margin-bottom: 0.8rem;
      max-width: 650px;
    }
    .hero-content h1 .highlight {
      background: linear-gradient(135deg, #ff2d55, #ff6b35);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero-content p {
      color: #a8b3cc;
      font-size: 1rem;
      max-width: 500px;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .hero-stats {
      display: flex;
      gap: 2.5rem;
      flex-wrap: wrap;
    }
    .hero-stats .stat h3 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
    }
    .hero-stats .stat p {
      font-size: 0.8rem;
      color: #6b7a99;
      margin: 0;
    }

    /* ===== FILTERS ===== */
    .filter-bar {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
      margin-bottom: 1.8rem;
      align-items: center;
    }
    .filter-chip {
      background: #151925;
      border: 1px solid #242a3a;
      color: #a8b3cc;
      padding: 0.55rem 1.3rem;
      border-radius: 50px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Inter', sans-serif;
    }
    .filter-chip i { font-size: 0.75rem; }
    .filter-chip:hover, .filter-chip.active {
      background: #ff2d55;
      border-color: #ff2d55;
      color: #fff;
    }
    .filter-chip.active { box-shadow: 0 6px 18px rgba(255,45,85,0.3); }

    /* ===== EVENTS GRID ===== */
    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
    }
    .section-title h2 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .section-title a {
      color: #ff2d55;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .events-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2.5rem;
    }

    .event-card {
      background: #11151f;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid #1e2433;
      transition: 0.25s;
      cursor: pointer;
      position: relative;
    }
    .event-card:hover {
      transform: translateY(-4px);
      border-color: #ff2d55;
      box-shadow: 0 18px 40px rgba(255,45,85,0.15);
    }
    .event-card .card-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: linear-gradient(135deg, #1a0b2e, #2d1b4e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: rgba(255,255,255,0.1);
      position: relative;
    }
    .event-card .card-img .date-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(10, 12, 20, 0.85);
      backdrop-filter: blur(4px);
      color: #fff;
      padding: 0.3rem 0.9rem;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .event-card .card-img .price-badge {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: linear-gradient(135deg, #ff2d55, #ff6b35);
      color: #fff;
      padding: 0.35rem 1rem;
      border-radius: 50px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .card-body {
      padding: 1.1rem 1.2rem 1.3rem;
    }
    .card-body .event-artist {
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 0.3rem;
      letter-spacing: -0.2px;
    }
    .card-body .event-venue {
      color: #6b7a99;
      font-size: 0.82rem;
      margin-bottom: 0.6rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card-body .event-venue i { font-size: 0.7rem; color: #ff2d55; }
    .card-body .event-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.8rem;
    }
    .card-body .event-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .card-body .event-tags span {
      background: #1a1f2e;
      padding: 0.2rem 0.7rem;
      border-radius: 30px;
      font-size: 0.65rem;
      font-weight: 600;
      color: #a8b3cc;
    }
    .card-body .btn-select {
      background: #ff2d55;
      border: none;
      color: #fff;
      font-weight: 700;
      font-size: 0.75rem;
      padding: 0.5rem 1.2rem;
      border-radius: 50px;
      cursor: pointer;
      transition: 0.2s;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card-body .btn-select:hover { background: #e0254a; transform: scale(1.03); }

    /* ===== BOOKING MODAL ===== */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(5, 7, 12, 0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      opacity: 0;
      pointer-events: none;
      transition: 0.3s;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal-box {
      background: #11151f;
      border: 1px solid #242a3a;
      border-radius: 32px;
      max-width: 900px;
      width: 100%;
      max-height: 92vh;
      overflow-y: auto;
      padding: 2.2rem 2.4rem;
      position: relative;
      transform: scale(0.95);
      transition: 0.3s;
      scrollbar-width: thin;
      scrollbar-color: #242a3a #11151f;
    }
    .modal-overlay.open .modal-box { transform: scale(1); }

    .modal-close {
      position: absolute;
      top: 1.2rem;
      right: 1.4rem;
      background: #1a1f2e;
      border: none;
      color: #a8b3cc;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: 0.2s;
    }
    .modal-close:hover { background: #ff2d55; color: #fff; }

    .modal-event-header {
      display: flex;
      gap: 1.2rem;
      margin-bottom: 1.8rem;
      align-items: flex-start;
      flex-wrap: wrap;
    }
    .modal-event-header .modal-event-img {
      width: 100px;
      height: 100px;
      border-radius: 20px;
      background: linear-gradient(135deg, #1a0b2e, #2d1b4e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      color: rgba(255,255,255,0.15);
      flex-shrink: 0;
    }
    .modal-event-header .modal-event-info h3 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 0.3rem;
    }
    .modal-event-header .modal-event-info p {
      color: #a8b3cc;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 0.3rem;
    }
    .modal-event-header .modal-event-info p i { color: #ff2d55; font-size: 0.8rem; }

    .modal-divider {
      border-top: 1px solid #1e2433;
      margin: 1.5rem 0;
    }

    .modal-section-label {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #6b7a99;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .modal-section-label i { color: #ff2d55; }

    .ticket-types {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .ticket-type {
      background: #0d1018;
      border: 2px solid #1e2433;
      border-radius: 20px;
      padding: 1rem 1.1rem;
      cursor: pointer;
      transition: 0.2s;
      position: relative;
    }
    .ticket-type:hover { border-color: #3a4a6a; }
    .ticket-type.selected {
      border-color: #ff2d55;
      background: rgba(255,45,85,0.06);
      box-shadow: 0 0 0 3px rgba(255,45,85,0.1);
    }
    .ticket-type .ticket-name {
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 0.2rem;
    }
    .ticket-type .ticket-desc {
      font-size: 0.72rem;
      color: #6b7a99;
      margin-bottom: 0.5rem;
    }
    .ticket-type .ticket-price {
      font-weight: 800;
      font-size: 1.2rem;
      color: #ff2d55;
    }
    .ticket-type .ticket-price small {
      font-size: 0.7rem;
      color: #6b7a99;
      font-weight: 500;
    }

    .qty-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .qty-row label {
      font-weight: 600;
      font-size: 0.85rem;
      color: #a8b3cc;
    }
    .qty-control {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: #0d1018;
      border: 1px solid #1e2433;
      border-radius: 50px;
      padding: 0.3rem 0.5rem;
    }
    .qty-control button {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: #1a1f2e;
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
      font-weight: 700;
    }
    .qty-control button:hover { background: #ff2d55; }
    .qty-control span {
      font-weight: 700;
      font-size: 1.1rem;
      min-width: 40px;
      text-align: center;
    }

    /* ===== PAYMENT SECTION ===== */
    .payment-section {
      background: #0d1018;
      border-radius: 24px;
      padding: 1.5rem 1.6rem;
      border: 1px solid #1e2433;
      margin-bottom: 1.5rem;
    }
    .payment-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
      flex-wrap: wrap;
      gap: 0.8rem;
    }
    .payment-header h4 {
      font-weight: 700;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .payment-header h4 i { color: #ff2d55; }
    .payment-methods {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
    }
    .payment-methods span {
      background: #11151f;
      border: 1px solid #1e2433;
      padding: 0.35rem 0.9rem;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 600;
      color: #a8b3cc;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .payment-methods span i { color: #ff2d55; font-size: 0.85rem; }

    .card-inputs {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    @media (max-width: 600px) {
      .card-inputs { grid-template-columns: 1fr; }
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .input-group label {
      font-size: 0.7rem;
      font-weight: 600;
      color: #6b7a99;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-group input {
      background: #11151f;
      border: 1px solid #1e2433;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 0.9rem;
      color: #fff;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: 0.2s;
    }
    .input-group input:focus {
      border-color: #ff2d55;
      box-shadow: 0 0 0 3px rgba(255,45,85,0.1);
    }
    .input-group input::placeholder { color: #4a5a7a; }

    .gateway-info {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      flex-wrap: wrap;
      font-size: 0.72rem;
      color: #6b7a99;
      padding: 0.6rem 0 0;
      border-top: 1px solid #1a1f2e;
      margin-top: 0.8rem;
    }
    .gateway-info i { color: #2b8c4a; }

    /* ===== TOTAL & ACTION ===== */
    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      padding-top: 1.2rem;
      border-top: 1px solid #1e2433;
    }
    .total-breakdown .total-label {
      font-size: 0.8rem;
      color: #6b7a99;
      margin-bottom: 0.2rem;
    }
    .total-breakdown .total-amount {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -1px;
      color: #fff;
    }
    .total-breakdown .total-amount small {
      font-size: 0.85rem;
      font-weight: 500;
      color: #6b7a99;
    }

    .btn-pay {
      background: linear-gradient(135deg, #ff2d55, #ff6b35);
      border: none;
      color: #fff;
      font-weight: 800;
      font-size: 1rem;
      padding: 16px 44px;
      border-radius: 60px;
      cursor: pointer;
      transition: 0.25s;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(255,45,85,0.3);
      letter-spacing: 0.3px;
    }
    .btn-pay:hover { transform: scale(1.03); box-shadow: 0 14px 40px rgba(255,45,85,0.45); }
    .btn-pay:active { transform: scale(0.97); }
    .btn-pay:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* ===== EMAIL CONFIRMATION TOAST ===== */
    .email-toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: #11151f;
      border: 1px solid #2b8c4a;
      border-radius: 20px;
      padding: 1.2rem 1.5rem;
      max-width: 380px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      z-index: 2000;
      display: flex;
      gap: 1rem;
      align-items: flex-start;
      transform: translateY(120%);
      transition: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }
    .email-toast.show {
      transform: translateY(0);
      pointer-events: all;
    }
    .email-toast .toast-icon {
      width: 44px;
      height: 44px;
      background: rgba(43, 140, 74, 0.15);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2b8c4a;
      font-size: 1.3rem;
      flex-shrink: 0;
    }
    .email-toast .toast-content h5 {
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 0.2rem;
    }
    .email-toast .toast-content p {
      font-size: 0.78rem;
      color: #a8b3cc;
      line-height: 1.5;
    }
    .email-toast .toast-content p strong { color: #fff; }
    .email-toast .toast-close {
      background: none;
      border: none;
      color: #6b7a99;
      cursor: pointer;
      font-size: 1rem;
      padding: 0.2rem;
      transition: 0.2s;
    }
    .email-toast .toast-close:hover { color: #fff; }

    /* ===== SUCCESS MODAL ===== */
    .success-modal .modal-box {
      max-width: 520px;
      text-align: center;
      padding: 2.5rem 2rem;
    }
    .success-modal .success-icon {
      width: 80px;
      height: 80px;
      background: rgba(43,140,74,0.12);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      color: #2b8c4a;
      margin: 0 auto 1.2rem;
      border: 2px solid rgba(43,140,74,0.3);
    }
    .success-modal h3 {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      letter-spacing: -0.5px;
    }
    .success-modal p {
      color: #a8b3cc;
      font-size: 0.9rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .success-modal .order-details {
      background: #0d1018;
      border-radius: 18px;
      padding: 1.2rem 1.4rem;
      text-align: left;
      margin-bottom: 1.5rem;
      border: 1px solid #1e2433;
    }
    .success-modal .order-details .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 0.4rem 0;
      font-size: 0.85rem;
      border-bottom: 1px solid #1a1f2e;
    }
    .success-modal .order-details .detail-row:last-child { border-bottom: none; }
    .success-mod
